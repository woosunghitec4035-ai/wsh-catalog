<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>우성하이텍 전시 자동재생</title>
  <link rel="stylesheet" href="tv.css?v=20260825-back1">
</head>
<body>
  <main id="stage" aria-live="polite">
    <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
    <header class="brand"><span class="brand-mark">W</span><b>WOOSUNG HITEC</b><em>시설원예 환경제어기술</em></header>
    <section id="slide" class="slide"></section>
    <footer>
      <div class="category" id="category"></div>
      <div class="progress"><i id="progress"></i></div>
      <div class="counter" id="counter"></div>
    </footer>
    <nav class="controls" aria-label="재생 조작">
      <button id="menuButton" class="menu-button" aria-label="재생목록">목록</button>
      <button id="prev" aria-label="이전 화면">‹</button>
      <button id="play" aria-label="일시정지">Ⅱ</button>
      <button id="next" aria-label="다음 화면">›</button>
      <button id="full" aria-label="전체 화면">⛶</button>
    </nav>
    <div class="hint" id="hint">화면을 누르면 조작 버튼이 표시됩니다</div>
    <section id="playlist" class="playlist" aria-label="재생목록">
      <button id="playlistBack" class="playlist-back" type="button">‹ 제품 안내로 돌아가기</button>
      <div class="playlist-head"><small>WOOSUNG HITEC · EXHIBITION PLAYLIST</small><h1>어떤 부분을 재생할까요?</h1><p>전체를 연속 재생하거나 원하는 제품 카테고리부터 바로 시작할 수 있습니다.</p></div>
      <div id="playlistItems" class="playlist-items"></div>
    </section>
  </main>
  <script src="tv.js?v=20260825-back1"></script>
  <script>
    document.getElementById('playlistBack').addEventListener('click',function(){
      if(window.opener&&!window.opener.closed){window.close();return;}
      location.href='../../index.html?view=products';
    });
  </script>
</body>
</html>
